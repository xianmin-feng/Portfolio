<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');

camera.position.set(0, 0, 10);

// Background
const bgPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 20),
  new THREE.ShaderMaterial({
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv;
      void main() {
        vec3 tl = vec3(0.35,0.32,0.28); vec3 tr = vec3(0.48,0.44,0.40);
        vec3 bl = vec3(0.25,0.23,0.21); vec3 br = vec3(0.40,0.37,0.34);
        vec3 col = mix(mix(bl,br,vUv.x), mix(tl,tr,vUv.x), vUv.y);
        float vig = 1.0 - smoothstep(0.4, 0.9, length(vUv - 0.5));
        col *= 0.88 + vig * 0.12;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
bgPlane.position.z = -5;
scene.add(bgPlane);

scene.add(new THREE.AmbientLight(0xfff5e6, 0.7));
const dirLight = new THREE.DirectionalLight(0xfff8f0, 0.6);
dirLight.position.set(3, 5, 5);
scene.add(dirLight);

// Helpers
function roundedRectGeo(w, h, r) {
  // Squircle (superellipse) shape
  const s = new THREE.Shape();
  const n = 4; // superellipse exponent (higher = more square, 2 = circle)
  const steps = 64;
  const hw = w / 2, hh = h / 2;
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const cosT = Math.cos(t);
    const sinT = Math.sin(t);
    const px = hw * Math.sign(cosT) * Math.pow(Math.abs(cosT), 2 / n);
    const py = hh * Math.sign(sinT) * Math.pow(Math.abs(sinT), 2 / n);
    if (i === 0) s.moveTo(px, py);
    else s.lineTo(px, py);
  }
  s.closePath();
  return new THREE.ShapeGeometry(s);
}

function canvasTex(fn, w=256, h=256) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter;
  return t;
}

// Shared icon drawing function - clean bold style matching video
function drawAppIcon(name, ctx, cx, cy, s) {
  const d = {
    'Browser': () => {
      // Compass style
      ctx.beginPath(); ctx.arc(cx, cy, s*0.9, 0, Math.PI*2); ctx.stroke();
      // Arrow pointing NE
      ctx.beginPath();
      ctx.moveTo(cx-s*0.15, cy+s*0.45);
      ctx.lineTo(cx+s*0.45, cy-s*0.45);
      ctx.lineTo(cx+s*0.15, cy-s*0.15);
      ctx.lineTo(cx-s*0.45, cy+s*0.45);
      ctx.closePath(); ctx.fill();
    },
    'Instagram': () => {
      // Rounded rect + circle + dot
      ctx.beginPath(); ctx.roundRect(cx-s*0.8, cy-s*0.8, s*1.6, s*1.6, s*0.35); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, s*0.4, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx+s*0.5, cy-s*0.5, s*0.1, 0, Math.PI*2); ctx.fill();
    },
    'Facebook': () => {
      ctx.font = `bold ${s*2.4}px 'Helvetica Neue', Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('f', cx+s*0.05, cy+s*0.08);
    },
    'Beat Saber': () => {
      // Two crossed sabers
      ctx.beginPath(); ctx.moveTo(cx-s*0.7, cy+s*0.7); ctx.lineTo(cx+s*0.5, cy-s*0.9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+s*0.7, cy+s*0.7); ctx.lineTo(cx-s*0.5, cy-s*0.9); ctx.stroke();
      // Handles
      ctx.beginPath(); ctx.moveTo(cx-s*0.7, cy+s*0.7); ctx.lineTo(cx-s*0.85, cy+s*0.85); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+s*0.7, cy+s*0.7); ctx.lineTo(cx+s*0.85, cy+s*0.85); ctx.stroke();
    },
    'Messenger': () => {
      // Chat bubble
      ctx.beginPath();
      ctx.moveTo(cx-s*0.15, cy+s*0.85);
      ctx.lineTo(cx-s*0.5, cy+s*0.45);
      ctx.quadraticCurveTo(cx-s*0.85, cy+s*0.1, cx-s*0.85, cy-s*0.2);
      ctx.quadraticCurveTo(cx-s*0.85, cy-s*0.85, cx, cy-s*0.85);
      ctx.quadraticCurveTo(cx+s*0.85, cy-s*0.85, cx+s*0.85, cy-s*0.2);
      ctx.quadraticCurveTo(cx+s*0.85, cy+s*0.45, cx, cy+s*0.45);
      ctx.closePath(); ctx.stroke();
      // Lightning bolt
      ctx.beginPath();
      ctx.moveTo(cx+s*0.15, cy-s*0.45);
      ctx.lineTo(cx-s*0.15, cy+s*0.05);
      ctx.lineTo(cx+s*0.05, cy+s*0.05);
      ctx.lineTo(cx-s*0.15, cy+s*0.35);
      ctx.stroke();
    },
    'Store': () => {
      // Shopping bag
      ctx.beginPath(); ctx.roundRect(cx-s*0.55, cy-s*0.3, s*1.1, s*1.15, s*0.1); ctx.stroke();
      // Handle
      ctx.beginPath(); ctx.arc(cx, cy-s*0.3, s*0.3, Math.PI, 0); ctx.stroke();
    },
    'TV': () => {
      // Monitor
      ctx.beginPath(); ctx.roundRect(cx-s*0.8, cy-s*0.6, s*1.6, s*1.0, s*0.1); ctx.stroke();
      // Stand
      ctx.beginPath(); ctx.moveTo(cx, cy+s*0.4); ctx.lineTo(cx, cy+s*0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-s*0.4, cy+s*0.7); ctx.lineTo(cx+s*0.4, cy+s*0.7); ctx.stroke();
      // Play triangle
      ctx.beginPath();
      ctx.moveTo(cx-s*0.15, cy-s*0.25); ctx.lineTo(cx-s*0.15, cy+s*0.15);
      ctx.lineTo(cx+s*0.25, cy-s*0.05); ctx.closePath(); ctx.fill();
    },
    'Spotify': () => {
      // Circle with 3 sound waves
      ctx.beginPath(); ctx.arc(cx, cy, s*0.9, 0, Math.PI*2); ctx.stroke();
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy+s*0.35, s*(0.35+i*0.2), -2.1, -1.04);
        ctx.stroke();
      }
    },
    'Max': () => {
      ctx.font = `800 ${s*0.9}px 'Helvetica Neue', Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('max', cx, cy+s*0.05);
    },
    'Horizon Worlds': () => {
      // Globe with horizon lines
      ctx.beginPath(); ctx.arc(cx, cy, s*0.85, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy, s*0.35, s*0.85, 0, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-s*0.85, cy); ctx.lineTo(cx+s*0.85, cy); ctx.stroke();
    },
    'Chats': () => {
      // Two overlapping chat bubbles
      ctx.beginPath();
      ctx.roundRect(cx-s*0.75, cy-s*0.65, s*1.15, s*0.85, s*0.15);
      ctx.stroke();
      ctx.beginPath();
      ctx.roundRect(cx-s*0.4, cy-s*0.15, s*1.15, s*0.85, s*0.15);
      ctx.stroke();
      // Lines in front bubble
      ctx.beginPath(); ctx.moveTo(cx-s*0.15, cy+s*0.15); ctx.lineTo(cx+s*0.5, cy+s*0.15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-s*0.15, cy+s*0.4); ctx.lineTo(cx+s*0.3, cy+s*0.4); ctx.stroke();
    },
    'WhatsApp': () => {
      // Phone icon in circle
      ctx.beginPath(); ctx.arc(cx, cy, s*0.85, 0, Math.PI*2); ctx.stroke();
      // Phone handset
      ctx.beginPath();
      ctx.moveTo(cx-s*0.35, cy+s*0.15);
      ctx.quadraticCurveTo(cx-s*0.35, cy+s*0.45, cx-s*0.1, cy+s*0.45);
      ctx.lineTo(cx+s*0.1, cy+s*0.45);
      ctx.quadraticCurveTo(cx+s*0.35, cy+s*0.45, cx+s*0.35, cy+s*0.15);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx-s*0.35, cy+s*0.15);
      ctx.quadraticCurveTo(cx-s*0.5, cy-s*0.2, cx-s*0.3, cy-s*0.4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx+s*0.35, cy+s*0.15);
      ctx.quadraticCurveTo(cx+s*0.5, cy-s*0.2, cx+s*0.3, cy-s*0.4);
      ctx.stroke();
    },
    'XBox': () => {
      // Circle with bold X
      ctx.beginPath(); ctx.arc(cx, cy, s*0.85, 0, Math.PI*2); ctx.stroke();
      ctx.font = `bold ${s*1.4}px 'Helvetica Neue', Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('X', cx, cy+s*0.05);
    },
    'YouTube': () => {
      ctx.beginPath(); ctx.roundRect(cx-s*0.8, cy-s*0.55, s*1.6, s*1.1, s*0.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-s*0.25, cy-s*0.35); ctx.lineTo(cx-s*0.25, cy+s*0.35); ctx.lineTo(cx+s*0.4, cy); ctx.closePath(); ctx.fill();
    },
    'Netflix': () => {
      ctx.font = `bold ${s*2}px 'Helvetica Neue', Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('N', cx, cy+s*0.05);
    },
    'Tiktok': () => {
      ctx.beginPath(); ctx.moveTo(cx+s*0.1, cy-s*0.8); ctx.lineTo(cx+s*0.1, cy+s*0.3);
      ctx.arc(cx-s*0.15, cy+s*0.3, s*0.35, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx+s*0.45, cy-s*0.5, s*0.25, -1.5, 0.8); ctx.stroke();
    },
    'Slack': () => {
      const d = s*0.25;
      ctx.beginPath(); ctx.arc(cx-d, cy-d, s*0.18, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+d, cy-d, s*0.18, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx-d, cy+d, s*0.18, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+d, cy+d, s*0.18, 0, Math.PI*2); ctx.fill();
    },
    'Maps': () => {
      ctx.beginPath(); ctx.moveTo(cx, cy-s*0.85); ctx.quadraticCurveTo(cx+s*0.6, cy-s*0.3, cx, cy+s*0.85);
      ctx.quadraticCurveTo(cx-s*0.6, cy-s*0.3, cx, cy-s*0.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy-s*0.25, s*0.2, 0, Math.PI*2); ctx.fill();
    },
    'Camera': () => {
      ctx.beginPath(); ctx.roundRect(cx-s*0.75, cy-s*0.35, s*1.5, s*0.9, s*0.1); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy+s*0.05, s*0.28, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-s*0.2, cy-s*0.35); ctx.lineTo(cx-s*0.1, cy-s*0.55);
      ctx.lineTo(cx+s*0.1, cy-s*0.55); ctx.lineTo(cx+s*0.2, cy-s*0.35); ctx.stroke();
    },
    'Files': () => {
      ctx.beginPath(); ctx.moveTo(cx-s*0.5, cy-s*0.3); ctx.lineTo(cx-s*0.5, cy-s*0.7);
      ctx.lineTo(cx-s*0.1, cy-s*0.7); ctx.lineTo(cx+s*0.1, cy-s*0.45);
      ctx.lineTo(cx+s*0.5, cy-s*0.45); ctx.lineTo(cx+s*0.5, cy+s*0.7);
      ctx.lineTo(cx-s*0.5, cy+s*0.7); ctx.closePath(); ctx.stroke();
    },
    'Calendar': () => {
      ctx.strokeRect(cx-s*0.6, cy-s*0.5, s*1.2, s*1.1);
      ctx.beginPath(); ctx.moveTo(cx-s*0.6, cy-s*0.15); ctx.lineTo(cx+s*0.6, cy-s*0.15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-s*0.3, cy-s*0.7); ctx.lineTo(cx-s*0.3, cy-s*0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+s*0.3, cy-s*0.7); ctx.lineTo(cx+s*0.3, cy-s*0.5); ctx.stroke();
      ctx.font = `bold ${s*0.7}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('17', cx, cy+s*0.25);
    },
    'Clock': () => {
      ctx.beginPath(); ctx.arc(cx, cy, s*0.8, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy-s*0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx+s*0.35, cy+s*0.1); ctx.stroke();
    },
    'Weather': () => {
      ctx.beginPath(); ctx.arc(cx+s*0.3, cy-s*0.3, s*0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.arc(cx-s*0.2, cy+s*0.2, s*0.35, Math.PI, 0);
      ctx.arc(cx+s*0.25, cy+s*0.2, s*0.25, Math.PI+0.3, -0.1);
      ctx.lineTo(cx-s*0.65, cy+s*0.2); ctx.stroke();
    },
    'Music': () => {
      ctx.beginPath(); ctx.arc(cx-s*0.3, cy+s*0.4, s*0.22, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx+s*0.3, cy+s*0.25, s*0.22, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-s*0.08, cy+s*0.4); ctx.lineTo(cx-s*0.08, cy-s*0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+s*0.52, cy+s*0.25); ctx.lineTo(cx+s*0.52, cy-s*0.75); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-s*0.08, cy-s*0.6); ctx.lineTo(cx+s*0.52, cy-s*0.75); ctx.stroke();
    },
    'Podcasts': () => {
      ctx.beginPath(); ctx.arc(cx, cy-s*0.15, s*0.25, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx, cy+s*0.1); ctx.lineTo(cx-s*0.2, cy+s*0.75); ctx.lineTo(cx+s*0.2, cy+s*0.75); ctx.closePath(); ctx.fill();
      for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.arc(cx, cy-s*0.15, s*(0.4+j*0.2), -2.2, -0.94); ctx.stroke(); }
    },
    'Gallery': () => {
      ctx.strokeRect(cx-s*0.7, cy-s*0.5, s*1.4, s*1.0);
      ctx.beginPath(); ctx.moveTo(cx-s*0.7, cy+s*0.2); ctx.lineTo(cx-s*0.2, cy-s*0.15);
      ctx.lineTo(cx+s*0.15, cy+s*0.1); ctx.lineTo(cx+s*0.4, cy-s*0.05); ctx.lineTo(cx+s*0.7, cy+s*0.2); ctx.stroke();
    },
  };
  if (d[name]) d[name]();
}

// App data
const apps = [
  { name: 'Browser',       c1: '#5BC0EB', c2: '#3AA0D1' },
  { name: 'Instagram',     c1: '#E1306C', c2: '#C13584' },
  { name: 'Facebook',      c1: '#1877F2', c2: '#1565C0' },
  { name: 'Beat Saber',    c1: '#C62828', c2: '#8E0000' },
  { name: 'Messenger',     c1: '#00B2FF', c2: '#006AFF' },

  { name: 'TV',            c1: '#9C27B0', c2: '#7B1FA2' },
  { name: 'Spotify',       c1: '#1DB954', c2: '#158A3E' },
  { name: 'Max',           c1: '#002BE7', c2: '#001090' },
  { name: 'Horizon Worlds',c1: '#36C5F0', c2: '#0097A7' },
  { name: 'Chats',         c1: '#7C4DFF', c2: '#651FFF' },
  { name: 'WhatsApp',      c1: '#25D366', c2: '#128C7E' },
  { name: 'XBox',          c1: '#107C10', c2: '#0A5E0A' },
  // Page 2
  { name: 'YouTube',       c1: '#FF0000', c2: '#CC0000' },
  { name: 'Netflix',       c1: '#E50914', c2: '#B20710' },
  { name: 'Tiktok',        c1: '#010101', c2: '#333333' },
  { name: 'Slack',         c1: '#4A154B', c2: '#36104A' },
  { name: 'Maps',          c1: '#34A853', c2: '#1B8A3E' },

  { name: 'Calendar',      c1: '#F4511E', c2: '#D84315' },
  { name: 'Clock',         c1: '#FFA726', c2: '#FB8C00' },
  { name: 'Weather',       c1: '#29B6F6', c2: '#0288D1' },
  { name: 'Music',         c1: '#EC407A', c2: '#C2185B' },

  { name: 'Gallery',       c1: '#26C6DA', c2: '#0097A7' },
];

// ===== APP GRID (4-5-4 staggered, 2 pages) =====
const appGridGroup = new THREE.Group();
const allTiles = [];
const TILE = 0.88;
const GAP = TILE * 2;
const PAGE_WIDTH = 10; // horizontal offset per page

const pages = [
  { group: new THREE.Group(), startIndex: 0 },
  { group: new THREE.Group(), startIndex: 13 },
];
pages.forEach(p => appGridGroup.add(p.group));

let currentPage = 0;
let targetPageX = 0;

// Row layout per page: 4, 5, 4
const rowCounts = [4, 5, 4];

for (let page = 0; page < 2; page++) {
  const pageGroup = pages[page].group;
  pageGroup.position.x = page * PAGE_WIDTH;
  let appIndex = pages[page].startIndex;

  for (let row = 0; row < rowCounts.length; row++) {
    const count = rowCounts[row];
    for (let col = 0; col < count; col++) {
      if (appIndex >= apps.length) break;
      const x = (col - (count-1)/2) * GAP;
      const y = (1 - row) * GAP + 0.3;
      const app = apps[appIndex];
      appIndex++;

  const group = new THREE.Group();
  group.position.set(x, y, 0);

  // --- LAYER 1: Colorful app tile background (stays at z=0) ---
  const color1 = new THREE.Color(app.c1);
  const bg = new THREE.Mesh(
    roundedRectGeo(TILE, TILE, 0.18),
    new THREE.MeshBasicMaterial({ color: color1 })
  );
  bg.position.z = 0;
  group.add(bg);

  // Invisible hit plane (stays at z=0, used for stable raycasting)
  const hitPlane = new THREE.Mesh(
    roundedRectGeo(TILE, TILE, 0.18),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hitPlane.position.z = 0;
  group.add(hitPlane);

  // --- LAYER 2: Icon shadow (same shape as icon but blurred and dark) ---

  allTiles.push({
    group, bg, shadow, icon, hitPlane,
    hovered: false,
    iconRestZ: 0.02,
    iconHoverZ: 0.45,

  });
  pageGroup.add(group);
    }

// Page switching
function switchPage(page) {
  currentPage = page;
  targetPageX = -page * PAGE_WIDTH;
  for (let i = 0; i < pageDots.length; i++) {
    pageDots[i].geometry.dispose();
    pageDots[i].geometry = new THREE.CircleGeometry(i === page ? 0.055 : 0.035, 16);
    pageDots[i].material.opacity = i === page ? 0.85 : 0.3;
  }
}

// Click dots to switch page
window.addEventListener('click', (e) => {
  raycaster.setFromCamera(mouse, camera);
  const dotHits = raycaster.intersectObjects(pageDots);
  if (dotHits.length > 0) {
    const idx = pageDots.indexOf(dotHits[0].object);
    if (idx >= 0) switchPage(idx);
  }
});

// Scroll/wheel to switch page
window.addEventListener('wheel', (e) => {
  if (!appGridGroup.visible) return;
  if (e.deltaY > 30 && currentPage < 1) switchPage(1);
  else if (e.deltaY < -30 && currentPage > 0) switchPage(0);
});

const lineIcons = {
  brightness: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx, cy, s*0.3, 0, Math.PI*2); ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const a = (i/8)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*s*0.45, cy+Math.sin(a)*s*0.45);
      ctx.lineTo(cx+Math.cos(a)*s*0.6, cy+Math.sin(a)*s*0.6);
      ctx.stroke();
    }
  },
  volume: (ctx, cx, cy, s) => {
    ctx.beginPath();
    ctx.moveTo(cx-s*0.3, cy-s*0.15); ctx.lineTo(cx-s*0.1, cy-s*0.15);
    ctx.lineTo(cx+s*0.15, cy-s*0.4); ctx.lineTo(cx+s*0.15, cy+s*0.4);
    ctx.lineTo(cx-s*0.1, cy+s*0.15); ctx.lineTo(cx-s*0.3, cy+s*0.15);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+s*0.2, cy, s*0.25, -0.8, 0.8); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+s*0.2, cy, s*0.42, -0.6, 0.6); ctx.stroke();
  },
  grid: (ctx, cx, cy, s) => {
    const g = s*0.25, o = cx-g, p = cy-g;
    for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
      ctx.strokeRect(o+c*g*1.1, p+r*g*1.1, g*0.9, g*0.9);
    }
  },
  wifi: (ctx, cx, cy, s) => {
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(cx, cy+s*0.2, s*(0.2+i*0.18), -2.3, -0.84); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, cy+s*0.25, s*0.05, 0, Math.PI*2); ctx.fill();
  },
  battery: (ctx, cx, cy, s) => {
    ctx.strokeRect(cx-s*0.35, cy-s*0.2, s*0.6, s*0.4);
    ctx.fillRect(cx+s*0.25, cy-s*0.1, s*0.08, s*0.2);
    ctx.fillRect(cx-s*0.28, cy-s*0.13, s*0.35, s*0.26);
  },
  clock: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx, cy, s*0.4, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy-s*0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx+s*0.18, cy+s*0.05); ctx.stroke();
  },
  home: (ctx, cx, cy, s) => {
    ctx.beginPath();
    ctx.moveTo(cx, cy-s*0.4); ctx.lineTo(cx+s*0.35, cy-s*0.05);
    ctx.lineTo(cx+s*0.35, cy+s*0.35); ctx.lineTo(cx-s*0.35, cy+s*0.35);
    ctx.lineTo(cx-s*0.35, cy-s*0.05); ctx.closePath(); ctx.stroke();
  },
  settings: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx, cy, s*0.2, 0, Math.PI*2); ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a = (i/6)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*s*0.3, cy+Math.sin(a)*s*0.3);
      ctx.lineTo(cx+Math.cos(a)*s*0.45, cy+Math.sin(a)*s*0.45);
      ctx.stroke();
    }
  },
  phone: (ctx, cx, cy, s) => {
    ctx.strokeRect(cx-s*0.18, cy-s*0.35, s*0.36, s*0.7);
    ctx.beginPath(); ctx.arc(cx, cy+s*0.25, s*0.04, 0, Math.PI*2); ctx.fill();
  },
  search: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx-s*0.08, cy-s*0.08, s*0.25, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+s*0.12, cy+s*0.12); ctx.lineTo(cx+s*0.35, cy+s*0.35); ctx.stroke();
  },
  arrowL: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.moveTo(cx+s*0.15, cy-s*0.3); ctx.lineTo(cx-s*0.15, cy); ctx.lineTo(cx+s*0.15, cy+s*0.3); ctx.stroke();
  },
  arrowR: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.moveTo(cx-s*0.15, cy-s*0.3); ctx.lineTo(cx+s*0.15, cy); ctx.lineTo(cx-s*0.15, cy+s*0.3); ctx.stroke();
  },
  camera: (ctx, cx, cy, s) => {
    ctx.strokeRect(cx-s*0.35, cy-s*0.2, s*0.7, s*0.45);
    ctx.beginPath(); ctx.arc(cx, cy+s*0.02, s*0.15, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s*0.1, cy-s*0.2); ctx.lineTo(cx-s*0.05, cy-s*0.32);
    ctx.lineTo(cx+s*0.05, cy-s*0.32); ctx.lineTo(cx+s*0.1, cy-s*0.2); ctx.stroke();
  },
  gamepad: (ctx, cx, cy, s) => {
    ctx.beginPath();
    ctx.moveTo(cx-s*0.35, cy); ctx.quadraticCurveTo(cx-s*0.35, cy-s*0.25, cx-s*0.15, cy-s*0.25);
    ctx.lineTo(cx+s*0.15, cy-s*0.25); ctx.quadraticCurveTo(cx+s*0.35, cy-s*0.25, cx+s*0.35, cy);
    ctx.quadraticCurveTo(cx+s*0.35, cy+s*0.25, cx+s*0.15, cy+s*0.25);
    ctx.lineTo(cx-s*0.15, cy+s*0.25); ctx.quadraticCurveTo(cx-s*0.35, cy+s*0.25, cx-s*0.35, cy);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s*0.22, cy-s*0.08); ctx.lineTo(cx-s*0.22, cy+s*0.08); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s*0.3, cy); ctx.lineTo(cx-s*0.14, cy); ctx.stroke();
  },
  person: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx, cy-s*0.18, s*0.16, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy+s*0.5, s*0.35, -2.6, -0.54); ctx.stroke();
  },
  globe: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx, cy, s*0.35, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, s*0.15, s*0.35, 0, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s*0.35, cy); ctx.lineTo(cx+s*0.35, cy); ctx.stroke();
  },
  folder: (ctx, cx, cy, s) => {
    ctx.beginPath();
    ctx.moveTo(cx-s*0.35, cy-s*0.15); ctx.lineTo(cx-s*0.35, cy-s*0.3);
    ctx.lineTo(cx-s*0.1, cy-s*0.3); ctx.lineTo(cx, cy-s*0.15);
    ctx.lineTo(cx+s*0.35, cy-s*0.15); ctx.lineTo(cx+s*0.35, cy+s*0.3);
    ctx.lineTo(cx-s*0.35, cy+s*0.3); ctx.closePath(); ctx.stroke();
  },
  star: (ctx, cx, cy, s) => {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i*4*Math.PI/5) - Math.PI/2;
      const r = s * 0.38;
      if (i === 0) ctx.moveTo(cx+r*Math.cos(a), cy+r*Math.sin(a));
      else ctx.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a));
    }
    ctx.closePath(); ctx.stroke();
  },
};

  const iconTex = canvasTex((ctx, w, h) => {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const cx = w/2, cy = h/2, s = w*0.35;
    if (sysBarTabs[i].tab === 'settings') {
      // Gear - exact match of the feather/lucide SVG gear icon
      // Inner circle
      ctx.beginPath(); ctx.arc(cx, cy, s*0.25, 0, Math.PI*2); ctx.stroke();
      // Outer gear path using 8 notches
      const teeth = 8, ri = s*0.42, ro = s*0.62, tw = 0.22;
      ctx.beginPath();
      for (let j = 0; j < teeth; j++) {
        const a = (j/teeth)*Math.PI*2 - Math.PI/2;
        const a1 = a - tw, a2 = a + tw;
        const na = ((j+1)/teeth)*Math.PI*2 - Math.PI/2;
        const na1 = na - tw;
        if (j === 0) ctx.moveTo(cx+Math.cos(a1)*ro, cy+Math.sin(a1)*ro);
        ctx.lineTo(cx+Math.cos(a2)*ro, cy+Math.sin(a2)*ro);
        ctx.lineTo(cx+Math.cos(a2+0.05)*ri, cy+Math.sin(a2+0.05)*ri);
        ctx.lineTo(cx+Math.cos(na1-0.05)*ri, cy+Math.sin(na1-0.05)*ri);

      ctx.beginPath(); ctx.roundRect(cx+gap/2, cy+gap/2, sz, sz, r); ctx.fill();
    } else {
      // Magnifying glass
      ctx.beginPath(); ctx.arc(cx-s*0.08, cy-s*0.08, s*0.4, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+s*0.2, cy+s*0.2); ctx.lineTo(cx+s*0.55, cy+s*0.55); ctx.stroke();
    }
  }, 64, 64);

  const tooltip = new THREE.Mesh(
    new THREE.PlaneGeometry(0.8, 0.25),
    new THREE.MeshBasicMaterial({ map: tooltipTex, transparent: true, opacity: 0, depthWrite: false })
  );
  tooltip.position.set(0, 0.35, 0.01);
  btnGroup.add(tooltip);

  sysBarButtons.push({ group: btnGroup, circle, backing, tooltip, tab: sysBarTabs[i].tab, isActive });
  sysBarGroup.add(btnGroup);
}
scene.add(sysBarGroup);

let activeTab = 'apps';
function switchTab(tab) {
  activeTab = tab;
  appGridGroup.visible = tab === 'apps';
  settingsGroup.visible = tab === 'settings';
  searchGroup.visible = tab === 'search';
  for (const btn of sysBarButtons) {
    btn.isActive = btn.tab === tab;
    btn.circle.material.opacity = btn.isActive ? 0.4 : 0;
  }
}

// Raycasting
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-10, -10);
window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});
window.addEventListener('click', () => {
  raycaster.setFromCamera(mouse, camera);
  const btnHits = raycaster.intersectObjects(sysBarButtons.map(b => b.circle));
  if (btnHits.length > 0) {
    const btn = sysBarButtons.find(b => b.circle === btnHits[0].object);
    if (btn) switchTab(btn.tab);
  }
});

// Animate
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  const speed = 10;

  if (appGridGroup.visible) {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(allTiles.map(t => t.hitPlane));
    for (const tile of allTiles) tile.hovered = false;
    if (hits.length > 0) {
      const tile = allTiles.find(t => t.hitPlane === hits[0].object);
      if (tile) { tile.hovered = true; document.body.style.cursor = 'pointer'; }
    } else { document.body.style.cursor = 'default'; }

    for (const tile of allTiles) {
      // Ease-out: fast start, smooth deceleration
      const easeOut = (cur, tgt) => cur + (tgt - cur) * (1 - Math.pow(0.0015, dt));

      // Background moves forward a little on hover
      const targetBgZ = tile.hovered ? 0.25 : 0;
      tile.bg.position.z = easeOut(tile.bg.position.z, targetBgZ);

      // Icon lifts forward on hover
      const targetZ = tile.hovered ? tile.iconHoverZ : tile.iconRestZ;
      tile.icon.position.z = easeOut(tile.icon.position.z, targetZ);

      // Shadow derives from actual gap between icon and bg
      const gap = tile.icon.position.z - tile.bg.position.z;
      const maxGap = tile.iconHoverZ - 0.25; // max possible gap
      const gapRatio = Math.max(0, Math.min(1, gap / maxGap));

      // Shadow opacity based on gap (no gap = no shadow)
      tile.shadow.material.opacity = gapRatio * 0.5;

      // Shadow sits just above bg surface
      tile.shadow.position.z = tile.bg.position.z + 0.01;

      // Shadow grows as icon lifts higher
      const shadowScale = 1 + gapRatio * 0.2;
      tile.shadow.scale.x = shadowScale;
      tile.shadow.scale.y = shadowScale;

    }
  }

  // System bar hover + tooltip
  raycaster.setFromCamera(mouse, camera);
  const btnHits = raycaster.intersectObjects(sysBarButtons.map(b => b.circle));
  const hoveredBtn = btnHits.length > 0 ? sysBarButtons.find(b => b.circle === btnHits[0].object) : null;
  for (const btn of sysBarButtons) {
    const isHovered = btn === hoveredBtn;
    const targetOp = isHovered ? 1 : 0;
    btn.tooltip.material.opacity += (targetOp - btn.tooltip.material.opacity) * (1 - Math.pow(0.001, dt));
    if (!btn.isActive) {
      const targetCircleOp = isHovered ? 0.25 : 0;
      btn.circle.material.opacity += (targetCircleOp - btn.circle.material.opacity) * (1 - Math.pow(0.001, dt));
    }
    if (isHovered) document.body.style.cursor = 'pointer';
  }

  // Page slide animation
  if (appGridGroup.visible) {
    const pageEase = (cur, tgt) => cur + (tgt - cur) * (1 - Math.pow(0.003, dt));
    const container = appGridGroup;
    const currentX = pages[0].group.parent.position.x || 0;
    // Move the whole grid content
    pages[0].group.position.x = pageEase(pages[0].group.position.x, targetPageX);
    pages[1].group.position.x = pageEase(pages[1].group.position.x, PAGE_WIDTH + targetPageX);
  }

  // Float
  const fy = Math.sin(t * 0.4) * 0.04;
  appGridGroup.position.y = fy;
  settingsGroup.position.y = fy;
  searchGroup.position.y = fy;
  sysBarGroup.position.y = -2.8 + fy;


  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
