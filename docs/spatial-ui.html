<body>

      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

<div id="canvas-container"></div>

<div class="info-panel">
  <p><strong>Hover</strong> app tiles to see z-depth layers &nbsp;|&nbsp; <strong>Click</strong> tabs to switch &nbsp;|&nbsp; <strong>Drag</strong> to orbit</p>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0xc4b5a3);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 16;

// Background
const bgPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 20),
  new THREE.ShaderMaterial({
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv;
      void main() {
        vec3 tl = vec3(0.58,0.52,0.44); vec3 tr = vec3(0.82,0.78,0.72);
        vec3 bl = vec3(0.50,0.46,0.38); vec3 br = vec3(0.76,0.72,0.66);
        vec3 col = mix(mix(bl,br,vUv.x), mix(tl,tr,vUv.x), vUv.y);
        float vig = 1.0 - smoothstep(0.4, 0.9, length(vUv - 0.5));
        col *= 0.88 + vig * 0.12;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
bgPlane.position.z = -5;
scene.add(bgPlane);

scene.add(new THREE.AmbientLight(0xfff5e6, 0.7));
const dirLight = new THREE.DirectionalLight(0xfff8f0, 0.6);
dirLight.position.set(3, 5, 5);
scene.add(dirLight);

// Helpers
function roundedRectGeo(w, h, r) {
  // Squircle (superellipse) shape
  const s = new THREE.Shape();
  const n = 4; // superellipse exponent (higher = more square, 2 = circle)
  const steps = 64;
  const hw = w / 2, hh = h / 2;
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const cosT = Math.cos(t);
    const sinT = Math.sin(t);
    const px = hw * Math.sign(cosT) * Math.pow(Math.abs(cosT), 2 / n);
    const py = hh * Math.sign(sinT) * Math.pow(Math.abs(sinT), 2 / n);
    if (i === 0) s.moveTo(px, py);
    else s.lineTo(px, py);
  }
  s.closePath();
  return new THREE.ShapeGeometry(s);
}

function canvasTex(fn, w=256, h=256) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter;
  return t;
}

// App data
const apps = [
  { name: 'Browser',    c1: '#4FC3F7', c2: '#0288D1', icon: '🌐' },
  { name: 'Instagram',  c1: '#F58529', c2: '#DD2A7B', icon: '📷' },
  { name: 'Facebook',   c1: '#4267B2', c2: '#1877F2', icon: '👤' },
  { name: 'Beat Saber', c1: '#E53935', c2: '#B71C1C', icon: '⚔️' },
  { name: 'Messenger',  c1: '#00C6FF', c2: '#0078FF', icon: '💬' },
  { name: 'Shop',       c1: '#FFB74D', c2: '#F57C00', icon: '🛒' },
  { name: 'Photos',     c1: '#CE93D8', c2: '#7B1FA2', icon: '🖼' },
  { name: 'Spotify',    c1: '#1ED760', c2: '#158A3E', icon: '🎵' },
  { name: 'Max',        c1: '#1A37E8', c2: '#001A8F', icon: '🎬' },
  { name: 'Sky',        c1: '#81D4FA', c2: '#29B6F6', icon: '☁️' },
  { name: 'WhatsApp',   c1: '#25D366', c2: '#128C7E', icon: '📱' },
  { name: 'FitXR',      c1: '#76FF03', c2: '#64DD17', icon: '💪' },
  { name: 'Explore',    c1: '#78909C', c2: '#546E7A', icon: '🧭' },
];

// ===== APP GRID (4-5-4 staggered) =====
const appGridGroup = new THREE.Group();
const allTiles = [];
const TILE = 0.88;
const GAP = TILE * 2;

// Row layout: 4, 5, 4
const rowLayout = [
  { count: 4, apps: apps.slice(0, 4) },
  { count: 5, apps: apps.slice(4, 9) },
  { count: 4, apps: apps.slice(9, 13) },
];
// Add one more app to fill 13
if (apps.length < 13) apps.push({ name: 'Explore', c1: '#78909C', c2: '#546E7A', icon: '🔭' });

let appIndex = 0;
for (let row = 0; row < rowLayout.length; row++) {
  const { count } = rowLayout[row];
  for (let col = 0; col < count; col++) {
    if (appIndex >= apps.length) break;
    const x = (col - (count-1)/2) * GAP;
    const y = (1 - row) * GAP + 0.3;
    const app = apps[appIndex];
    appIndex++;

  const group = new THREE.Group();
  group.position.set(x, y, 0);

  // --- LAYER 1: Colorful app tile background (stays at z=0) ---
  const color1 = new THREE.Color(app.c1);
  const bg = new THREE.Mesh(
    roundedRectGeo(TILE, TILE, 0.18),
    new THREE.MeshBasicMaterial({ color: color1 })
  );
  bg.position.z = 0;
  group.add(bg);

  // --- LAYER 2: Icon shadow (cast onto colorful bg when icon lifts) ---
  // Starts fully invisible, fades in on hover
  const shadow = new THREE.Mesh(
    roundedRectGeo(TILE * 0.45, TILE * 0.45, 0.08),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthWrite: false })
  );
  shadow.position.z = 0.005;
  group.add(shadow);

  // --- LAYER 3: White icon (lifts forward on hover) ---
  const iconTex = canvasTex((ctx, w, h) => {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const cx = w/2, cy = h/2, s = w * 0.35;
    // Draw white line-style icon for each app
    const iconDrawers = {
      'Browser': () => {
        ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(cx, cy, s*0.4, s, 0, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx-s, cy); ctx.lineTo(cx+s, cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy-s); ctx.lineTo(cx, cy+s); ctx.stroke();
      },
      'Instagram': () => {
        const r = s*0.3;
        ctx.beginPath(); ctx.roundRect(cx-s, cy-s, s*2, s*2, r); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, s*0.45, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx+s*0.6, cy-s*0.6, s*0.12, 0, Math.PI*2); ctx.fill();
      },
      'Facebook': () => {
        ctx.font = `bold ${s*2.2}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('f', cx+s*0.1, cy+s*0.1);
      },
      'Beat Saber': () => {
        ctx.beginPath(); ctx.moveTo(cx-s*0.6, cy+s*0.8); ctx.lineTo(cx+s*0.3, cy-s*0.8); ctx.lineTo(cx+s*0.6, cy-s*0.5);
        ctx.lineTo(cx-s*0.3, cy+s*0.8); ctx.closePath(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx-s*0.1, cy-s*0.1); ctx.lineTo(cx+s*0.6, cy-s*0.8); ctx.stroke();
      },
      'Messenger': () => {
        ctx.beginPath();
        ctx.moveTo(cx, cy+s); ctx.lineTo(cx-s*0.4, cy+s*0.5);
        ctx.quadraticCurveTo(cx-s, cy+s*0.1, cx-s, cy-s*0.2);
        ctx.quadraticCurveTo(cx-s, cy-s, cx, cy-s);
        ctx.quadraticCurveTo(cx+s, cy-s, cx+s, cy-s*0.2);
        ctx.quadraticCurveTo(cx+s, cy+s*0.5, cx+s*0.1, cy+s*0.7);
        ctx.closePath(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx-s*0.4, cy+s*0.1); ctx.lineTo(cx, cy-s*0.2); ctx.lineTo(cx+s*0.4, cy+s*0.1); ctx.stroke();
      },
      'Shop': () => {
        ctx.beginPath(); ctx.moveTo(cx-s*0.8, cy-s*0.5); ctx.lineTo(cx-s*0.5, cy-s*0.5);
        ctx.lineTo(cx-s*0.3, cy+s*0.7); ctx.lineTo(cx+s*0.8, cy+s*0.7); ctx.lineTo(cx+s*0.9, cy-s*0.1);
        ctx.lineTo(cx-s*0.2, cy-s*0.1); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx-s*0.1, cy+s*0.95, s*0.12, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx+s*0.55, cy+s*0.95, s*0.12, 0, Math.PI*2); ctx.stroke();
      },
      'Photos': () => {
        ctx.strokeRect(cx-s*0.8, cy-s*0.6, s*1.6, s*1.2);
        ctx.beginPath(); ctx.moveTo(cx-s*0.8, cy+s*0.3); ctx.lineTo(cx-s*0.2, cy-s*0.1);
        ctx.lineTo(cx+s*0.2, cy+s*0.2); ctx.lineTo(cx+s*0.5, cy-s*0.05); ctx.lineTo(cx+s*0.8, cy+s*0.3); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx-s*0.35, cy-s*0.2, s*0.15, 0, Math.PI*2); ctx.fill();
      },
      'Spotify': () => {
        ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI*2); ctx.stroke();
        for (let i = 0; i < 3; i++) {
          ctx.beginPath(); ctx.arc(cx, cy+s*0.3, s*(0.4+i*0.22), -2.2, -0.94); ctx.stroke();
        }
      },
      'Max': () => {
        ctx.font = `bold ${s*1.4}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('max', cx, cy+s*0.1);
      },
      'Sky': () => {
        ctx.beginPath();
        ctx.arc(cx-s*0.15, cy, s*0.45, Math.PI, 0);
        ctx.arc(cx+s*0.4, cy, s*0.3, Math.PI+0.3, -0.1);
        ctx.lineTo(cx-s*0.7, cy); ctx.arc(cx-s*0.5, cy, s*0.2, Math.PI, 0);
        ctx.stroke();
      },
      'WhatsApp': () => {
        ctx.beginPath(); ctx.arc(cx, cy-s*0.1, s*0.8, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx-s*0.3, cy+s*0.6); ctx.quadraticCurveTo(cx-s*0.8, cy+s*1, cx-s*0.1, cy+s*0.8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx-s*0.3, cy); ctx.quadraticCurveTo(cx-s*0.3, cy-s*0.35, cx, cy-s*0.35);
        ctx.quadraticCurveTo(cx+s*0.3, cy-s*0.35, cx+s*0.3, cy);
        ctx.quadraticCurveTo(cx+s*0.3, cy+s*0.2, cx+s*0.1, cy+s*0.25);
        ctx.lineTo(cx-s*0.1, cy+s*0.25); ctx.stroke();
      },
      'FitXR': () => {
        ctx.beginPath(); ctx.arc(cx, cy-s*0.5, s*0.25, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy-s*0.25); ctx.lineTo(cx, cy+s*0.5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx-s*0.5, cy); ctx.lineTo(cx+s*0.5, cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy+s*0.5); ctx.lineTo(cx-s*0.3, cy+s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy+s*0.5); ctx.lineTo(cx+s*0.3, cy+s); ctx.stroke();
      },
      'Explore': () => {
        ctx.beginPath(); ctx.arc(cx, cy, s*0.85, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx-s*0.15, cy+s*0.4); ctx.lineTo(cx-s*0.4, cy-s*0.15);
        ctx.lineTo(cx+s*0.15, cy-s*0.4); ctx.lineTo(cx+s*0.4, cy+s*0.15); ctx.closePath(); ctx.fill();
      },
    };
    if (iconDrawers[app.name]) iconDrawers[app.name]();
  }, 128, 128);
  const icon = new THREE.Mesh(
    new THREE.PlaneGeometry(TILE * 0.55, TILE * 0.55),
    new THREE.MeshBasicMaterial({ map: iconTex, transparent: true, depthWrite: false })
  );
  icon.position.z = 0.02;
  group.add(icon);

  // Label below
  const labelTex = canvasTex((ctx, w, h) => {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = '500 22px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(app.name, w/2, h/2);
  }, 256, 48);
  const label = new THREE.Mesh(
    new THREE.PlaneGeometry(TILE * 0.95, TILE * 0.17),
    new THREE.MeshBasicMaterial({ map: labelTex, transparent: true, depthWrite: false })
  );
  label.position.set(0, -TILE * 0.56, 0.01);
  group.add(label);

  allTiles.push({
    group, bg, shadow, icon,
    hovered: false,
    iconRestZ: 0.02,
    iconHoverZ: 0.45,
    currentScale: 1,
  });
  appGridGroup.add(group);
  }
}

// Pagination dots (vertical, right side)
for (let i = 0; i < 3; i++) {
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(i === 0 ? 0.055 : 0.035, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: i === 0 ? 0.85 : 0.3 })
  );
  dot.position.set(5, (1 - i) * 0.2 + 0.3, 0);
  appGridGroup.add(dot);
}
scene.add(appGridGroup);

// Glowing orb
const orbGroup = new THREE.Group();
orbGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.1, 32, 32), new THREE.MeshBasicMaterial({ color: 0x6366f1 })));
const glowTex = canvasTex((ctx, w, h) => {
  const grd = ctx.createRadialGradient(w/2,h/2,w*0.08,w/2,h/2,w*0.45);
  grd.addColorStop(0, 'rgba(99,102,241,0.7)');
  grd.addColorStop(0.5, 'rgba(99,102,241,0.15)');
  grd.addColorStop(1, 'rgba(99,102,241,0)');
  ctx.fillStyle = grd; ctx.fillRect(0,0,w,h);
});
const glowMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(0.8, 0.8),
  new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false })
);
orbGroup.add(glowMesh);
orbGroup.position.set(0, 2.5, 0.1);
scene.add(orbGroup);

// ===== SETTINGS BAR =====
const settingsGroup = new THREE.Group();
settingsGroup.visible = false;

// Line icon drawing functions
const lineIcons = {
  brightness: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx, cy, s*0.3, 0, Math.PI*2); ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const a = (i/8)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*s*0.45, cy+Math.sin(a)*s*0.45);
      ctx.lineTo(cx+Math.cos(a)*s*0.6, cy+Math.sin(a)*s*0.6);
      ctx.stroke();
    }
  },
  volume: (ctx, cx, cy, s) => {
    ctx.beginPath();
    ctx.moveTo(cx-s*0.3, cy-s*0.15); ctx.lineTo(cx-s*0.1, cy-s*0.15);
    ctx.lineTo(cx+s*0.15, cy-s*0.4); ctx.lineTo(cx+s*0.15, cy+s*0.4);
    ctx.lineTo(cx-s*0.1, cy+s*0.15); ctx.lineTo(cx-s*0.3, cy+s*0.15);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+s*0.2, cy, s*0.25, -0.8, 0.8); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+s*0.2, cy, s*0.42, -0.6, 0.6); ctx.stroke();
  },
  grid: (ctx, cx, cy, s) => {
    const g = s*0.25, o = cx-g, p = cy-g;
    for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
      ctx.strokeRect(o+c*g*1.1, p+r*g*1.1, g*0.9, g*0.9);
    }
  },
  wifi: (ctx, cx, cy, s) => {
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(cx, cy+s*0.2, s*(0.2+i*0.18), -2.3, -0.84); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, cy+s*0.25, s*0.05, 0, Math.PI*2); ctx.fill();
  },
  battery: (ctx, cx, cy, s) => {
    ctx.strokeRect(cx-s*0.35, cy-s*0.2, s*0.6, s*0.4);
    ctx.fillRect(cx+s*0.25, cy-s*0.1, s*0.08, s*0.2);
    ctx.fillRect(cx-s*0.28, cy-s*0.13, s*0.35, s*0.26);
  },
  clock: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx, cy, s*0.4, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy-s*0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx+s*0.18, cy+s*0.05); ctx.stroke();
  },
  home: (ctx, cx, cy, s) => {
    ctx.beginPath();
    ctx.moveTo(cx, cy-s*0.4); ctx.lineTo(cx+s*0.35, cy-s*0.05);
    ctx.lineTo(cx+s*0.35, cy+s*0.35); ctx.lineTo(cx-s*0.35, cy+s*0.35);
    ctx.lineTo(cx-s*0.35, cy-s*0.05); ctx.closePath(); ctx.stroke();
  },
  settings: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx, cy, s*0.2, 0, Math.PI*2); ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a = (i/6)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*s*0.3, cy+Math.sin(a)*s*0.3);
      ctx.lineTo(cx+Math.cos(a)*s*0.45, cy+Math.sin(a)*s*0.45);
      ctx.stroke();
    }
  },
  phone: (ctx, cx, cy, s) => {
    ctx.strokeRect(cx-s*0.18, cy-s*0.35, s*0.36, s*0.7);
    ctx.beginPath(); ctx.arc(cx, cy+s*0.25, s*0.04, 0, Math.PI*2); ctx.fill();
  },
  search: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx-s*0.08, cy-s*0.08, s*0.25, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+s*0.12, cy+s*0.12); ctx.lineTo(cx+s*0.35, cy+s*0.35); ctx.stroke();
  },
  arrowL: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.moveTo(cx+s*0.15, cy-s*0.3); ctx.lineTo(cx-s*0.15, cy); ctx.lineTo(cx+s*0.15, cy+s*0.3); ctx.stroke();
  },
  arrowR: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.moveTo(cx-s*0.15, cy-s*0.3); ctx.lineTo(cx+s*0.15, cy); ctx.lineTo(cx-s*0.15, cy+s*0.3); ctx.stroke();
  },
  camera: (ctx, cx, cy, s) => {
    ctx.strokeRect(cx-s*0.35, cy-s*0.2, s*0.7, s*0.45);
    ctx.beginPath(); ctx.arc(cx, cy+s*0.02, s*0.15, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s*0.1, cy-s*0.2); ctx.lineTo(cx-s*0.05, cy-s*0.32);
    ctx.lineTo(cx+s*0.05, cy-s*0.32); ctx.lineTo(cx+s*0.1, cy-s*0.2); ctx.stroke();
  },
  gamepad: (ctx, cx, cy, s) => {
    ctx.beginPath();
    ctx.moveTo(cx-s*0.35, cy); ctx.quadraticCurveTo(cx-s*0.35, cy-s*0.25, cx-s*0.15, cy-s*0.25);
    ctx.lineTo(cx+s*0.15, cy-s*0.25); ctx.quadraticCurveTo(cx+s*0.35, cy-s*0.25, cx+s*0.35, cy);
    ctx.quadraticCurveTo(cx+s*0.35, cy+s*0.25, cx+s*0.15, cy+s*0.25);
    ctx.lineTo(cx-s*0.15, cy+s*0.25); ctx.quadraticCurveTo(cx-s*0.35, cy+s*0.25, cx-s*0.35, cy);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s*0.22, cy-s*0.08); ctx.lineTo(cx-s*0.22, cy+s*0.08); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s*0.3, cy); ctx.lineTo(cx-s*0.14, cy); ctx.stroke();
  },
  person: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx, cy-s*0.18, s*0.16, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy+s*0.5, s*0.35, -2.6, -0.54); ctx.stroke();
  },
  globe: (ctx, cx, cy, s) => {
    ctx.beginPath(); ctx.arc(cx, cy, s*0.35, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, s*0.15, s*0.35, 0, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s*0.35, cy); ctx.lineTo(cx+s*0.35, cy); ctx.stroke();
  },
  folder: (ctx, cx, cy, s) => {
    ctx.beginPath();
    ctx.moveTo(cx-s*0.35, cy-s*0.15); ctx.lineTo(cx-s*0.35, cy-s*0.3);
    ctx.lineTo(cx-s*0.1, cy-s*0.3); ctx.lineTo(cx, cy-s*0.15);
    ctx.lineTo(cx+s*0.35, cy-s*0.15); ctx.lineTo(cx+s*0.35, cy+s*0.3);
    ctx.lineTo(cx-s*0.35, cy+s*0.3); ctx.closePath(); ctx.stroke();
  },
  star: (ctx, cx, cy, s) => {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i*4*Math.PI/5) - Math.PI/2;
      const r = s * 0.38;
      if (i === 0) ctx.moveTo(cx+r*Math.cos(a), cy+r*Math.sin(a));
      else ctx.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a));
    }
    ctx.closePath(); ctx.stroke();
  },
};

function makeIconTex(drawFn) {
  return canvasTex((ctx, w, h) => {
    ctx.strokeStyle = 'rgba(80, 70, 60, 0.55)';
    ctx.fillStyle = 'rgba(80, 70, 60, 0.55)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    drawFn(ctx, w/2, h/2, w*0.4);
  }, 64, 64);
}

const barData = [
  { y: 0.65, opacity: 0.18, pills: [
    { w: 0.55, drawIcons: [lineIcons.brightness] },
    { w: 0.55, drawIcons: [lineIcons.volume] },
    { w: 0.55, drawIcons: [lineIcons.grid] },
    { w: 0.55, drawIcons: [lineIcons.wifi] },
    { w: 0.55, drawIcons: [lineIcons.battery] },
    { w: 0.55, drawIcons: [lineIcons.clock] },
  ]},
  { y: 0, opacity: 0.35, pills: [
    { w: 0.9, drawIcons: [lineIcons.arrowL] },
    { w: 2.2, drawIcons: [lineIcons.home, lineIcons.settings, lineIcons.phone, lineIcons.search] },
    { w: 0.9, drawIcons: [lineIcons.arrowR] },
  ]},
  { y: -0.65, opacity: 0.22, pills: [
    { w: 1.3, drawIcons: [lineIcons.camera, lineIcons.gamepad] },
    { w: 1.3, drawIcons: [lineIcons.person, lineIcons.globe] },
    { w: 1.3, drawIcons: [lineIcons.folder, lineIcons.star] },
  ]},
];

for (const row of barData) {
  const totalW = row.pills.reduce((s, p) => s + p.w, 0) + (row.pills.length-1) * 0.12;
  let ox = -totalW / 2;
  for (const pill of row.pills) {
    const px = ox + pill.w / 2;
    ox += pill.w + 0.12;
    const pillMesh = new THREE.Mesh(
      roundedRectGeo(pill.w, 0.42, 0.2),
      new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: row.opacity, roughness: 0.3, clearcoat: 0.5 })
    );
    pillMesh.position.set(px, row.y, 0);
    settingsGroup.add(pillMesh);
    const iconCount = pill.drawIcons.length;
    const spacing = pill.w / (iconCount + 1);
    for (let j = 0; j < iconCount; j++) {
      const ix = px - pill.w/2 + spacing * (j + 1);
      const iMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(0.25, 0.25),
        new THREE.MeshBasicMaterial({ map: makeIconTex(pill.drawIcons[j]), transparent: true, depthWrite: false })
      );
      iMesh.position.set(ix, row.y, 0.01);
      settingsGroup.add(iMesh);
    }
  }
}
for (let i = 0; i < 3; i++) {
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(i === 1 ? 0.055 : 0.035, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: i === 1 ? 0.85 : 0.3 })
  );
  dot.position.set((i-1) * 0.18, -1.3, 0);
  settingsGroup.add(dot);
}
scene.add(settingsGroup);

// ===== SEARCH VIEW =====
const searchGroup = new THREE.Group();
searchGroup.visible = false;

const searchBar = new THREE.Mesh(
  roundedRectGeo(4.5, 0.48, 0.24),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, roughness: 0.3, clearcoat: 0.5 })
);
searchBar.position.set(0, 1.2, 0);
searchGroup.add(searchBar);

const sTex = canvasTex((ctx, w, h) => {
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '400 20px Inter, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('🔍  Search apps, settings...', 20, h/2);
}, 512, 48);
const sLabel = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 0.35),
  new THREE.MeshBasicMaterial({ map: sTex, transparent: true, depthWrite: false })
);
sLabel.position.set(0, 1.2, 0.01);
searchGroup.add(sLabel);

const rTex = canvasTex((ctx, w, h) => {
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '500 20px Inter, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Recent', 10, h/2);
}, 192, 36);
const rMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 0.18),
  new THREE.MeshBasicMaterial({ map: rTex, transparent: true, depthWrite: false })
);
rMesh.position.set(-2, 0.55, 0);
searchGroup.add(rMesh);

for (let i = 0; i < 6; i++) {
  const app = apps[i]; const x = (i - 2.5) * 0.9;
  const iTex = canvasTex((ctx, w, h) => {
    const m = 4, r = w * 0.22;
    const grd = ctx.createLinearGradient(m, m, w-m, h-m);
    grd.addColorStop(0, app.c1); grd.addColorStop(1, app.c2);
    ctx.beginPath(); ctx.roundRect(m, m, w-m*2, h-m*2, r);
    ctx.fillStyle = grd; ctx.fill();
    ctx.font = `${w*0.4}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(app.icon, w/2, h/2+2);
  });
  const mesh = new THREE.Mesh(roundedRectGeo(0.6, 0.6, 0.12), new THREE.MeshBasicMaterial({ map: iTex }));
  mesh.position.set(x, -0.05, 0);
  searchGroup.add(mesh);
  const lTex = canvasTex((ctx, w, h) => {
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = '400 18px Inter, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 3;
    ctx.fillText(app.name, w/2, h/2);
  }, 192, 36);
  const lMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(0.75, 0.14),
    new THREE.MeshBasicMaterial({ map: lTex, transparent: true, depthWrite: false })
  );
  lMesh.position.set(x, -0.48, 0);
  searchGroup.add(lMesh);
}
scene.add(searchGroup);

// Tab switching
const tabBtns = document.querySelectorAll('.tab-btn');
let activeTab = 'apps';
function switchTab(tab) {
  activeTab = tab;
  tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  appGridGroup.visible = tab === 'apps';
  settingsGroup.visible = tab === 'settings';
  searchGroup.visible = tab === 'search';
}
tabBtns.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

// Raycasting
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-10, -10);
window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

// Animate
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  const speed = 10;

  if (appGridGroup.visible) {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(allTiles.map(t => t.bg));
    for (const tile of allTiles) tile.hovered = false;
    if (hits.length > 0) {
      const tile = allTiles.find(t => t.bg === hits[0].object);
      if (tile) { tile.hovered = true; document.body.style.cursor = 'pointer'; }
    } else { document.body.style.cursor = 'default'; }

    for (const tile of allTiles) {
      // Icon lifts forward on hover
      const targetZ = tile.hovered ? tile.iconHoverZ : tile.iconRestZ;
      tile.icon.position.z += (targetZ - tile.icon.position.z) * dt * speed;

      // Shadow becomes visible on hover (cast onto the colorful bg)
      const targetShadowOpacity = tile.hovered ? 0.6 : 0;
      tile.shadow.material.opacity += (targetShadowOpacity - tile.shadow.material.opacity) * dt * speed;

      // Shadow stays on the bg surface (z=0.01), doesn't move
      // Shadow gets slightly larger when icon is higher
      const shadowScale = tile.hovered ? 1.15 : 1;
      tile.shadow.scale.x += (shadowScale - tile.shadow.scale.x) * dt * speed;
      tile.shadow.scale.y += (shadowScale - tile.shadow.scale.y) * dt * speed;

      // Slight scale up on hover
      const sc = tile.hovered ? 1.05 : 1;
      tile.currentScale += (sc - tile.currentScale) * dt * speed;
      tile.group.scale.setScalar(tile.currentScale);
    }
  }

  // Float
  const fy = Math.sin(t * 0.4) * 0.04;
  appGridGroup.position.y = fy;
  settingsGroup.position.y = fy;
  searchGroup.position.y = fy;

  // Orb pulse
  orbGroup.scale.setScalar(1 + Math.sin(t * 2) * 0.08);
  glowMesh.material.opacity = 0.5 + Math.sin(t * 1.5) * 0.15;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
